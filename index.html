<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AsepTamvan Realtime Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
</head>
<body>

    <div class="dashboard">
        <header class="header">
            <div class="brand">ASEP<span>TAMVAN</span></div>
            <div class="connection">
                <span id="dot"></span>
                <span id="status">Syncing Firebase...</span>
            </div>
        </header>

        <div class="main-grid">
            <div class="card scanner-box">
                <div id="interactive" class="viewport"></div>
                <div class="overlay">
                    <div class="focus-rect"></div>
                </div>
                <div class="badge">LIVE SCANNER</div>
            </div>

            <div class="card detail-box">
                <p class="label">Produk Terdeteksi</p>
                <h2 id="name">Menunggu...</h2>
                <div class="price-wrapper">
                    <span class="curr">Rp</span>
                    <span id="price">0</span>
                </div>
                <div class="divider"></div>
                <button id="clear-btn" class="btn-secondary">Bersihkan Log</button>
            </div>
        </div>

        <div class="card history-box">
            <h3>Database Monitoring (Realtime)</h3>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Waktu</th>
                            <th>Barcode</th>
                            <th>Item</th>
                            <th>Harga</th>
                        </tr>
                    </thead>
                    <tbody id="log-table">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
