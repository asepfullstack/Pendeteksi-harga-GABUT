<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Price Scanner Pro - @Asep</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
</head>
<body>

    <div id="interactive" class="viewport"></div>

    <div class="ui-wrapper">
        <header class="top-nav">
            <div class="glass-pill">TECH-SCAN v6.0</div>
            <div id="status" class="glass-pill status-active">MENCARI BARCODE...</div>
        </header>

        <section class="focus-area">
            <div class="scanner-box">
                <div class="scan-line"></div>
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
            </div>
        </section>

        <footer class="info-area">
            <div class="result-card">
                <span class="label">IDENTIFIKASI PRODUK</span>
                <h2 id="item-name">Arahkan Kamera ke Barcode</h2>
                <h1 id="item-price">Rp 0</h1>
                <p class="hint">Pastikan barcode berada di dalam kotak biru</p>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
